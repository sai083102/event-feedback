{% extends "base.html" %}
{% block title %}Login — EventPulse{% endblock %}

{% block content %}
<div class="page-hero">
  <div class="hero-content">
    <span class="hero-tag">Restricted</span>
    <h1 class="hero-title">Dashboard Login</h1>
    <p class="hero-subtitle">Enter the password to view collected feedback.</p>
  </div>
</div>

<div class="container">
  <div class="form-card" style="max-width:420px;margin:0 auto;">
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="Enter password" autocomplete="current-password" autofocus />
        {% if error %}<span class="form-error" style="display:block">{{ error }}</span>{% endif %}
      </div>
      <button type="submit" class="btn-submit">
        <span class="btn-text">Log In</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
